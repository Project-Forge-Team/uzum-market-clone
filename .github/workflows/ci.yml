name: Marketplace CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

# Отменяем устаревшие запуски при новом коммите в тот же PR/ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Минимально необходимые права для GITHUB_TOKEN
permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build application
        # Пробрасываем переменные окружения в шаг сборки
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build
